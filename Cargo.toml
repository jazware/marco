# marco: a graph database for atproto actor-to-actor edges. The engine
# (marco-core), the server (marco-server) and its API (marco-proto), the
# built-in Jetstream and firehose consumers (marco-ingest) and their harness
# (marco-harness), and the bulk loader (marco-load). seek, the actor
# typeahead service that calls marco, lives here too (seek-*, docs/seek.html).
# Builds on vlatproto by path.
[workspace]
resolver = "2"
members = ["crates/*"]

# Every crate's version: a release (scripts/marco-public/release.sh) bumps it here.
[workspace.package]
version = "0.1.0"

[workspace.dependencies]
marco-core = { path = "crates/marco-core", default-features = false }
marco-ingest = { path = "crates/marco-ingest" }
marco-ops = { path = "crates/marco-ops" }
marco-proto = { path = "crates/marco-proto" }
marco-server = { path = "crates/marco-server" }
# Keep in step with buffa_version and connect_rust_version in the justfile:
# the generated code targets these runtimes.
buffa = { version = "0.9.2", default-features = false, features = ["std"] }
connectrpc = { version = "0.9.1", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
libc = "0.2"
vlatproto = { git = "https://github.com/jazware/vlatproto", rev = "b41d16a865a8dc28158c9bb7ce4e75d9ca809737" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.9"
rayon = "1"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tracing = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustc-hash = "2"
arc-swap = "1"
crossbeam-epoch = "0.9"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
rust-embed = "8"
prometheus = { version = "0.14", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
pprof = { version = "0.15", features = ["prost-codec"] }
tikv-jemallocator = { version = "0.7", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
jemalloc_pprof = "0.9"
scylla = { version = "1.9.0", default-features = false }
uuid = "1"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 1

# Release images (the image workflow on v* tags): fat LTO, one codegen unit.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 1
debug = 0
codegen-units = 256

[profile.test.package."*"]
opt-level = 2
codegen-units = 16
