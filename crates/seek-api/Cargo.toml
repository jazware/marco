[package]
name = "seek-api"
version.workspace = true
edition = "2021"
description = "seek's API: the reference AppView dataplane's SearchActorsTypeahead (bsky.Service) as buffa messages and a connect-rust service, generated by `just gen`"
license = "MIT"
publish = false

[features]
# The generated client (tests, and an AppView calling seek from Rust)
client = ["connectrpc/client"]

[dependencies]
buffa = { workspace = true, features = ["json"] }
connectrpc = { workspace = true, features = ["json", "gzip", "zstd"] }
serde = { workspace = true }
serde_json = { workspace = true }
