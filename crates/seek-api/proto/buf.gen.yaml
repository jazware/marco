# Run from this directory via `just gen` (marco), which puts the pinned local plugins on
# PATH. Rust (buffa messages + connect-rust services) into seek-api.
version: v2
clean: true
plugins:
  - local: protoc-gen-buffa
    out: ../src/gen/buffa
    opt: [views=true, json=true]
  - local: protoc-gen-connect-rust
    out: ../src/gen/connect
    opt: [buffa_module=crate::proto]
  - local: protoc-gen-buffa-packaging
    out: ../src/gen/connect
    strategy: all
    opt: [filter=services]
