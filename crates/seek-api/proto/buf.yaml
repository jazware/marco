version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # The dataplane's own names: package bsky, service Service, and request/response types the
    # reference AppView's client already uses. Renaming any would break wire compatibility.
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - WIRE_JSON
